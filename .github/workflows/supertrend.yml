name: SUPERTREND

on:
  schedule:
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:

concurrency:
  group: repo-main-push
  cancel-in-progress: false

jobs:
  supertrend:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ejecutar supertrend
        run: python supertrend.py

      - name: Commit state
        run: |
          git config user.name "supertrend-bot"
          git config user.email "bot@users.noreply.github.com"

          git add data/supertrend_state.json

          if git diff --staged --quiet; then
            echo "📭 Sin cambios"
          else
            git commit -m "supertrend: update state [skip ci]"

            for i in 1 2 3; do
              git pull --rebase origin main && break
              echo "⚠️ Pull intento $i falló, reintentando en 5s..."
              sleep 5
            done

            for i in 1 2 3; do
              git push && echo "✅ Push OK" && break
              echo "⚠️ Push intento $i falló, reintentando en 10s..."
              git pull --rebase origin main || true
              sleep 10
            done
          fi
