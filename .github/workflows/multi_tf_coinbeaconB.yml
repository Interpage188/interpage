name: MULTI TF COINBEACON B

permissions:
  contents: write

on:
  workflow_dispatch:

concurrency:
  group: coinbeaconB-interpage
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests

      - name: Verify Python
        run: |
          python --version
          python -m py_compile multi_tf_coinbeaconB.py
          echo "✅ Python OK"

      - name: Run MULTI TF COINBEACON B
        env:
          COINBEACON_TOKEN: ${{ secrets.COINBEACON_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "========================================"
          echo "🚀 INICIO COINBEACON B"
          date -u
          echo "========================================"

          python -u multi_tf_coinbeaconB.py

          echo "========================================"
          echo "🏁 FIN COINBEACON B"
          date -u
          echo "========================================"

      - name: Commit historical data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/ 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "📭 No hay cambios para guardar."
            exit 0
          fi

          git commit -m "Multi TF CoinBeaconB: update [skip ci]"

          for i in 1 2 3; do
            echo "🔄 Push intento $i..."

            git pull --rebase origin main || {
              echo "⚠️ Pull falló, reintento $i"
              git rebase --abort 2>/dev/null || true
              sleep 10
              continue
            }

            if git push origin HEAD:main; then
              echo "✅ Push OK"
              exit 0
            fi

            echo "⚠️ Push falló."
            sleep 10
          done

          echo "❌ No se pudo hacer push después de 3 intentos."
          exit 1
