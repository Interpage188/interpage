name: MULTI TF COINBEACON B

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coinbeaconB-interpage
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests

      - name: Verify Python
        run: |
          python --version
          python -m py_compile multi_tf_coinbeaconB.py
          echo "✅ Python OK"

      - name: Run MULTI TF COINBEACON B
        env:
          COINBEACON_TOKEN: ${{ secrets.COINBEACON_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "========================================"
          echo "🚀 INICIO COINBEACON B"
          date -u
          echo "========================================"

          python -u multi_tf_coinbeaconB.py

          echo "========================================"
          echo "🏁 FIN COINBEACON B"
          date -u
          echo "========================================"

      - name: Commit historical data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/multi_tf_coinbeaconB.csv \
            data/multi_tf_coinbeaconB_state.json \
            data/historial_lineas_B.csv \
            data/correlacion_btc_alt_B.csv \
            data/multi_tf_coinbeaconB_throttle.json \
            2>/dev/null || true

          if git diff --cached --quiet; then
            echo "📭 No hay cambios para guardar."
            exit 0
          fi

          git commit -m "Actualizar Multi-TF CoinBeaconB"

          for i in 1 2 3; do
            echo "🔄 Push intento $i..."

            git pull --rebase origin main && \
            git push origin HEAD:main && \
            echo "✅ Push OK" && \
            exit 0

            echo "⚠️ Push falló."
            sleep 10
          done

          echo "❌ No se pudo hacer push después de 3 intentos."
          exit 1
