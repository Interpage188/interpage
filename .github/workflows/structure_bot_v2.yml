name: STRUCTURE BOT V2

on:
  workflow_dispatch:

  schedule:
    # Cada 5 minutos
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: structure-bot-v2
  cancel-in-progress: false

jobs:
  structure-v2:
    name: Structure Bot V2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ejecutar Structure Bot V2
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python structure_bot_v2.py

      - name: Guardar estado V2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/structure_v2_state.json

          if git diff --cached --quiet; then
            echo "Sin cambios en el estado V2."
          else
            git commit -m "chore: update structure bot v2 state"
            git push
          fi
