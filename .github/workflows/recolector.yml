name: RECOLECTOR

permissions:
  contents: write

on:
  workflow_dispatch:  # <- Solo manual, cron-job.org lo dispara

concurrency:
  group: recolector-interpage
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      # ... (el resto de los pasos se mantiene igual) ...
      - name: Commit cache
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cache/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "📭 Sin cambios."
            exit 0
          fi
          git commit -m "Recolector [skip ci] $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git pull --rebase origin main && \
            git push origin HEAD:main && \
            echo "✅ Push OK" && \
            exit 0
            echo "⚠️ Intento $i falló, reintentando..."
            sleep 10
          done
          echo "❌ No se pudo hacer push"
          exit 1
