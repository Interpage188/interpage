name: RECOLECTOR

permissions:
  contents: write

on:
  schedule:
    # Cada 5 min. Cada moneda decide internamente si guarda según su zona RSI.
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:

concurrency:
  group: recolector
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Python syntax (recolector)
        run: |
          python -m py_compile recolector.py
          echo "✅ Sintaxis recolector OK"

      - name: Check Python syntax (watcher)
        run: |
          python -m py_compile watcher.py
          echo "✅ Sintaxis watcher OK"

      - name: Run RECOLECTOR
        run: python recolector.py

      - name: Run WATCHER
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python watcher.py

      - name: Show cache status
        if: always()
        run: |
          echo "📁 Archivos en data/cache/:"
          ls -la data/cache/ 2>/dev/null | head -20 || echo "(vacío)"

          echo ""
          echo "📊 Resumen:"
          if [ -d data/cache ]; then
            total=$(ls data/cache/*.json 2>/dev/null | wc -l)
            echo "   Archivos cache: $total"
            du -sh data/cache/ 2>/dev/null
          fi

          echo ""
          if [ -f data/pending_levels.json ]; then
            python -c "import json;d=json.load(open('data/pending_levels.json'));print(f'   Niveles pendientes: {len(d)}')"
          else
            echo "   Sin pending_levels.json aún"
          fi

      - name: Commit cache + pending levels
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -d data/cache ]; then
            git add data/cache/
          fi
          if [ -f data/pending_levels.json ]; then
            git add data/pending_levels.json
          fi

          if git diff --staged --quiet; then
            echo "📭 Sin cambios."
          else
            git commit -m "Recolector + Watcher [skip ci] $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main || true
            git push || echo "⚠️ Push falló (race condition), se reintentará en el próximo ciclo"
          fi
