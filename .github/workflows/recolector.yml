name: RECOLECTOR

permissions:
  contents: write

on:
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:

concurrency:
  group: repo-main-push
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Python syntax (recolector)
        run: |
          python -m py_compile recolector.py
          echo "✅ Sintaxis recolector OK"

      - name: Run RECOLECTOR
        run: python recolector.py

      - name: Show cache status
        if: always()
        run: |
          echo "📁 Archivos en data/cache/:"
          ls -la data/cache/ 2>/dev/null | head -20 || echo "(vacío)"

          echo ""
          echo "📊 Resumen:"
          if [ -d data/cache ]; then
            total=$(ls data/cache/*.json 2>/dev/null | wc -l)
            echo "   Archivos cache: $total"
            du -sh data/cache/ 2>/dev/null
          fi

      - name: Commit cache
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -d data/cache ]; then
            git add data/cache/
          fi

          if git diff --staged --quiet; then
            echo "📭 Sin cambios."
          else
            git commit -m "Recolector [skip ci] $(date -u +'%Y-%m-%d %H:%M UTC')"

            # Pull con reintentos
            for i in 1 2 3; do
              git pull --rebase origin main && break
              echo "⚠️ Pull intento $i falló, reintentando en 5s..."
              sleep 5
            done

            # Push con reintentos
            for i in 1 2 3; do
              git push && echo "✅ Push OK" && break
              echo "⚠️ Push intento $i falló, reintentando en 10s..."
              git pull --rebase origin main || true
              sleep 10
            done
          fi
